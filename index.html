<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Demo</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 6rem;
    }
    h2 {
      margin: 0 0 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    a {
      display: block;
      padding: 0.35rem 0;
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.25;
      color: inherit;
      text-decoration: none;
    }
    a:hover { opacity: 0.55; }
  </style>
</head>
<body>
  <main>
    <h2>Demo</h2>
    <ul>
      <li><a href="https://portal.sutton.top/">AI Portal Demo</a></li>
    </ul>
  </main>
</body>
</html>
