<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Demo</title>
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="icon.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <style>
    @font-face {
      font-family: Inter;
      src: url("fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --body-bg: #fdfdfc;
      --ink: #111;
      --muted: rgba(0, 0, 0, 0.4);
      --rule: #f2f2f2;
      --focus: rgba(0, 122, 255, 0.5);
      --page-max: 36.375rem;
      --title-inset: 6.75rem;
      --duration-row: 0.14s;
      color-scheme: light;
    }

    * {
      outline: 0;
      padding: 0;
      margin: 0;
      border: 0;
      box-sizing: border-box;
    }

    html {
      background: var(--body-bg);
      color: var(--ink);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      overflow-y: scroll;
      font-size: 16px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 460;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      text-size-adjust: none;
    }

    ::selection {
      color: var(--ink);
      background: #ededed;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 100px;
    }
    :hover::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .page {
      position: relative;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 5rem 1rem 5rem;
    }

    .page::before {
      content: "";
      pointer-events: none;
      z-index: 9;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 8rem;
      background: linear-gradient(
        180deg,
        #fff 0,
        hsla(0, 0%, 100%, 0.738) 19%,
        hsla(0, 0%, 100%, 0.541) 34%,
        hsla(0, 0%, 100%, 0.382) 47%,
        hsla(0, 0%, 100%, 0.278) 56.5%,
        hsla(0, 0%, 100%, 0.194) 65%,
        hsla(0, 0%, 100%, 0.126) 73%,
        hsla(0, 0%, 100%, 0.075) 80.2%,
        hsla(0, 0%, 100%, 0.042) 86.1%,
        hsla(0, 0%, 100%, 0.021) 91%,
        hsla(0, 0%, 100%, 0.008) 95.2%,
        hsla(0, 0%, 100%, 0.002) 98.2%,
        hsla(0, 0%, 100%, 0)
      );
    }

    .post-list {
      list-style: none;
    }

    .post-list__label {
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 460;
      letter-spacing: -0.00563rem;
      line-height: 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--rule);
    }

    .post-list > ul {
      display: flex;
      flex-direction: column;
      list-style: none;
    }

    .post-list > ul > li {
      border-bottom: 1px solid var(--rule);
    }

    .post-list > ul > li:last-child {
      border-bottom: none;
    }

    .post-list > ul > li > ul {
      display: flex;
      flex-direction: column;
      list-style: none;
    }

    .post-list a {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      padding: 0.735rem 0 0.735rem var(--title-inset);
    }

    .post-list a::after {
      content: "";
      border-bottom: 1px solid var(--rule);
      position: absolute;
      bottom: 0;
      left: var(--title-inset);
      right: 0;
    }

    .post-list > ul > li > ul > li:last-child > a::after {
      display: none;
    }

    .post-list h2 {
      min-width: 0;
      color: var(--ink);
      font-size: 0.875rem;
      font-weight: 460;
      letter-spacing: -0.00563rem;
      line-height: normal;
      transition: opacity var(--duration-row) ease;
    }

    .post-list time {
      position: static;
      flex-shrink: 0;
      margin-left: auto;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 460;
      line-height: normal;
      letter-spacing: -0.00563rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .post-list time span {
      display: inline-block;
      transition: opacity var(--duration-row) ease;
    }

    .post-list time span:nth-child(2) {
      position: absolute;
      width: 0;
      height: 0;
      padding: 0;
      overflow: hidden;
    }

    .post-list time span:last-child {
      visibility: hidden;
      position: absolute;
      left: 0;
    }

    .post-list > ul > li > ul > li:first-child > a > time > span:last-child {
      visibility: visible;
    }

    @media screen and (min-width: 520px) {
      .post-list > ul:hover > li > ul > li > a h2,
      .post-list > ul:hover > li > ul > li > a time span {
        opacity: 0.3;
      }

      .post-list > ul:hover > li > ul > li > a time span:last-child {
        opacity: 1;
      }

      .post-list > ul > li > ul > li > a:hover h2,
      .post-list > ul > li > ul > li > a:hover time span {
        opacity: 1;
      }
    }

    @media screen and (max-width: 520px) {
      :root { --title-inset: 3rem; }
    }

    @media screen and (max-width: 768px) {
      .page {
        padding: 2rem 1.5rem 5rem;
      }
      .page::before {
        height: 2.5rem;
      }
    }

    @keyframes staggerIn {
      0% { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    html:not(.home-visited) .post-list__label,
    html:not(.home-visited) .post-list > ul > li {
      animation: staggerIn 0.5s ease both;
    }

    html:not(.home-visited) .post-list__label { animation-delay: 0s; }
    html:not(.home-visited) .post-list > ul > li:nth-child(1) { animation-delay: 0.05s; }
    html:not(.home-visited) .post-list > ul > li:nth-child(2) { animation-delay: 0.1s; }
    html:not(.home-visited) .post-list > ul > li:nth-child(3) { animation-delay: 0.15s; }
    html:not(.home-visited) .post-list > ul > li:nth-child(n + 4) { animation-delay: 0.2s; }

    @media (prefers-reduced-motion: reduce) {
      html:not(.home-visited) .post-list__label,
      html:not(.home-visited) .post-list > ul > li {
        animation: none;
      }
      .post-list h2,
      .post-list time span {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="post-list" data-variant="primary" aria-labelledby="list-title">
      <h3 class="post-list__label" id="list-title">Demo</h3>
      <ul>
        <li>
          <ul>
            <li>
              <a href="https://portal.sutton.top/">
                <h2>AI Portal Demo</h2>
                <time datetime="2026-09-08">
                  <span>8/Sep</span><span>/</span><span>2026</span>
                </time>
              </a>
            </li>
            <li>
              <a href="https://clp.sutton.top/">
                <h2>CLP Group Demo</h2>
                <time datetime="2026-09-08">
                  <span>8/Sep</span><span>/</span><span>2026</span>
                </time>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </section>
  </main>
  <script>
    window.setTimeout(function () {
      document.documentElement.classList.add("home-visited");
    }, 1200);
  </script>
</body>
</html>
